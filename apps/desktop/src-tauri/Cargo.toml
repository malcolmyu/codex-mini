[package]
name = "codex-wechat-desktop"
version = "0.1.0"
description = "macOS floating widget for the Codex WeChat ACP bridge"
authors = ["Codex WeChat Bridge contributors"]
edition = "2021"

[lib]
name = "codex_wechat_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
